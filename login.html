{% extends "base.html" %}{% block title %}Sign in{% endblock %}{% block auth_content %}
<div class="auth-card"><span class="eyebrow">WELCOME BACK</span><h1>Good to see you.</h1><p class="muted">Sign in to keep your finances on track.</p>
<form method="post"><label>Email address</label><input type="email" name="email" placeholder="you@example.com" required><label>Password</label><input type="password" name="password" placeholder="Enter your password" required><button class="btn primary full">Sign in →</button></form>
<p class="auth-foot">New to FinTrack? <a href="{{ url_for('register') }}">Create an account</a></p></div>{% endblock %}
